spring:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: true
  sql:
    init:
      mode: always
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/ewm_stats
    username: admin
    password: admin

server:
  port: 0

kafka:
  bootstrap-server: localhost:9092
  client-id: AnalyzerConsumer
  group-id: some.group.id
  topic: stats.user-actions.v1
  topic-sums: stats.events-similarity.v1