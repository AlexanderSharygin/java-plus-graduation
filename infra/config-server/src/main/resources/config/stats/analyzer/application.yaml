server:
  port: 0
  
spring:
  application:
    name: analyzer
  sql:
    init:
      mode: always
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
          lob:
            non_contextual_creation: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/ewm_stats
    username: admin
    password: admin

grpc:
  server:
    port: 0

analyzer:
  user-consumer-properties:
    bootstrap.servers: localhost:9092
    group.id: user.analyzing
    client.id: hubConsumer
    key.deserializer: org.apache.kafka.common.serialization.VoidDeserializer
    value.deserializer: ru.practicum.ewm.deserializer.UserActionDeserializer
    enable.auto.commit: false
  user-topics:
    - stats.user-actions.v1

  similarity-consumer-properties:
    bootstrap.servers: localhost:9092
    group.id: similarity.analyzing
    client.id: snapshotConsumer
    key.deserializer: org.apache.kafka.common.serialization.VoidDeserializer
    value.deserializer: ru.practicum.ewm.deserializer.EventSimilarityDeserializer
    enable.auto.commit: false
  similarity-topics:
    - stats.events-similarity.v1
  consume-attempt-timeout: 1000