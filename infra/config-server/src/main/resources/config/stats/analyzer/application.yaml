server:
  port: 0

spring:
  application:
    name: analyzer
  sql:
    init:
      mode: always
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
          lob:
            non_contextual_creation: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/ewm_stats
    username: admin
    password: admin

kafka:
  consumers:
    actions:
      uri: localhost:9092
      group-id: actions.analyzer
      auto-offset-reset: earliest
      enable-auto-commit: false
      consume-attempt-timeout-ms: 100
      key-deserializer: org.apache.kafka.common.serialization.VoidDeserializer
      value-deserializer: ru.practicum.ewm.deserializer.UserActionDeserializer
    similarity:
      uri: localhost:9092
      group-id: similarity.analyzer
      auto-offset-reset: earliest
      enable-auto-commit: false
      consume-attempt-timeout-ms: 100
      key-deserializer: org.apache.kafka.common.serialization.VoidDeserializer
      value-deserializer: ru.practicum.ewm.deserializer.EventSimilarityDeserializer

  topics:
    actions:
      - stats.user-actions.v1
    similarity:
      - stats.events-similarity.v1

grpc:
  client:
    hub-router:
      address: 'static://localhost:59090'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext